body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(0,238,178,.08),rgba(95,255,80,.10));
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:10;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.18),transparent 36%),linear-gradient(180deg,rgba(255,255,255,.04),transparent 28%,rgba(0,50,80,.05));
}
button{font:inherit}
.app{width:min(1000px,calc(100% - 32px));margin:0 auto;padding:30px 0 46px;position:relative;z-index:2}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-shadow:0 3px 0 rgba(0,94,150,.35),0 0 12px rgba(255,255,255,.75)}
.logo{font-size:clamp(30px,5vw,54px);font-weight:900;font-style:italic;letter-spacing:-2px;transform:skew(-7deg);line-height:.9}
.logo small{display:block;font-size:12px;letter-spacing:2px;font-style:normal;margin:7px 0 0 6px}
.stats{display:flex;gap:10px}
.stat{min-width:108px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 24px rgba(0,80,120,.18),inset 0 2px 0 rgba(255,255,255,.75),inset 0 -8px 18px rgba(0,176,210,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;text-align:center;font-weight:900;text-shadow:0 2px 4px rgba(0,70,100,.28)}
.stat b{display:block;font-size:20px;line-height:1}
.stat span{display:block;font-size:11px;margin-top:4px;opacity:.95}
.screen{display:none;animation:pop .35s ease both}
.screen.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.card{border:1px solid var(--line);border-radius:32px;background:rgba(255,255,255,.17);box-shadow:var(--shadow);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:3%;right:3%;top:8px;height:30%;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.34),transparent);pointer-events:none}
.quiz-card{padding:34px 38px 32px}
.badge{display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;background:rgba(0,184,218,.24);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 5px 14px rgba(0,100,150,.15);color:#fff;font-size:13px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,80,120,.25)}
.word{margin:20px 0 2px;text-align:center;font-family:var(--y2k);font-size:clamp(38px,7vw,68px);font-weight:900;font-style:italic;letter-spacing:-2px;color:#fff;text-shadow:0 4px 0 rgba(0,110,180,.45),0 0 18px rgba(255,255,255,.9);transform:skew(-4deg)}
.question{text-align:center;font-size:clamp(20px,3vw,30px);font-weight:900;color:#fff;text-shadow:0 3px 5px rgba(0,90,130,.38);margin:0 0 7px}
.hint{text-align:center;color:#eaffff;font-size:14px;font-weight:800;text-shadow:0 2px 4px rgba(0,80,110,.3);margin:0 0 28px}
.options{display:grid;gap:12px}
.option{position:relative;width:100%;min-height:68px;border:1px solid rgba(255,255,255,.68);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.09));box-shadow:0 8px 18px rgba(0,90,120,.14),inset 0 2px 0 rgba(255,255,255,.72),inset 0 -10px 20px rgba(0,170,205,.07);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);color:#075b91;font-weight:900;font-size:18px;cursor:pointer;text-align:left;padding:14px 20px;display:flex;align-items:center;gap:14px;transition:transform .14s ease,box-shadow .14s ease,background .14s ease;overflow:hidden}
.option::before{content:"";position:absolute;left:18px;right:18px;top:7px;height:18px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent);pointer-events:none}
.option:hover{transform:translateY(-2px) scale(1.012);box-shadow:0 12px 24px rgba(0,90,120,.18),inset 0 2px 0 rgba(255,255,255,.82)}
.option:active{transform:translateY(2px) scale(.99)}
.option:disabled{cursor:default}
.letter{flex:0 0 38px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,rgba(35,225,244,.80),rgba(0,119,207,.72));border:1px solid rgba(255,255,255,.72);box-shadow:inset 0 2px 0 rgba(255,255,255,.75),0 4px 10px rgba(0,90,150,.18);text-shadow:0 2px 3px rgba(0,70,110,.35)}
.option.correct{background:rgba(76,241,120,.34);border-color:rgba(255,255,255,.9)}
.option.wrong{background:rgba(255,86,112,.28);border-color:rgba(255,220,225,.9)}
.option.reveal{background:rgba(74,235,120,.28)}
.feedback{margin-top:18px;padding:22px;border-radius:24px;background:rgba(255,255,255,.19);border:1px solid rgba(255,255,255,.63);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 8px 20px rgba(0,90,120,.12);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);display:none}
.feedback.show{display:block;animation:pop .25s ease both}
.feedback-head{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,80,110,.3);margin-bottom:10px}
.feedback-head.ok{color:#f2fff6}.feedback-head.no{color:#fff1f3}
.meaning{font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,80,110,.32);margin:4px 0 14px}
.example-label{font-size:11px;font-weight:900;letter-spacing:1.4px;color:#e9ffff}
.example{font-size:18px;line-height:1.55;font-weight:900;color:#075b91;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:13px 15px;margin-top:5px}
.translation{font-size:15px;line-height:1.55;color:#eaffff;font-weight:800;margin-top:7px}
.next{width:100%;margin-top:14px;border:1px solid rgba(255,255,255,.78);border-radius:18px;padding:13px 18px;background:linear-gradient(180deg,rgba(0,171,221,.58),rgba(0,115,191,.40));color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 8px 16px rgba(0,90,130,.17);text-shadow:0 2px 3px rgba(0,70,100,.3);transition:.14s}
.next:hover{transform:translateY(-2px)}.next:active{transform:translateY(1px)}
.result{padding:38px}
.result-title{text-align:center;color:#fff;font-size:42px;font-weight:900;font-style:italic;text-shadow:0 3px 0 rgba(0,100,160,.4)}
.score{text-align:center;font-size:64px;color:#fff;font-weight:900;text-shadow:0 4px 0 rgba(0,100,160,.38)}
.score span{font-size:22px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.result-box{padding:18px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.58);text-align:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.62)}
.result-box b{display:block;font-size:28px;color:#fff;text-shadow:0 2px 4px rgba(0,80,110,.3)}.result-box span{font-size:12px;color:#eaffff;font-weight:900}
.review-title{font-size:20px;color:#fff;font-weight:900;margin:24px 0 10px;text-shadow:0 2px 4px rgba(0,80,110,.3)}
.review{display:grid;gap:8px;max-height:300px;overflow:auto;padding-right:4px}
.review-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.48);color:#075b91;font-weight:900}
.review-item small{color:#eaffff;font-weight:800}
.restart{width:100%;margin-top:18px;border:1px solid rgba(255,255,255,.78);border-radius:20px;padding:15px;background:linear-gradient(180deg,rgba(76,239,125,.68),rgba(0,180,114,.40));color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.78),0 10px 20px rgba(0,100,120,.18);text-shadow:0 2px 3px rgba(0,80,100,.28)}
.progress{height:9px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);overflow:hidden;margin-bottom:16px;box-shadow:inset 0 2px 4px rgba(0,80,100,.15)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#08bfe8,#55f06c,#b6ff64);box-shadow:0 0 10px rgba(100,255,200,.75);transition:width .3s ease}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.65);transform:scale(0);animation:ripple .5s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(5);opacity:0}}
.footer{text-align:center;color:rgba(255,255,255,.9);font-size:11px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,70,100,.25);margin-top:14px}

 .app{width:min(100% - 18px,620px);padding-top:14px}
 .topbar{align-items:flex-start}.stats{gap:6px}.stat{min-width:76px;padding:8px 9px}.stat b{font-size:16px}.stat span{font-size:9px}
 .logo{font-size:34px}.logo small{font-size:9px}
 .quiz-card,.result{padding:24px 17px}.card{border-radius:25px}
 .word{font-size:43px}.question{font-size:21px}.hint{font-size:12px;margin-bottom:20px}

<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">Vocab Aero<small>ENGLISH VOCABULARY QUIZ</small></div></div>
    <div class="stats"><div class="stat"><b id="progressText">1 / 10</b><span>문제</span></div><div class="stat"><b id="accuracyText">0%</b><span>정답률</span></div></div>
  </header>

  <main id="quizScreen" class="screen active">
    <div class="progress"><i id="progressBar"></i></div>
    <section class="card quiz-card">
      <div class="badge">✦ 뜻 고르기</div>
      <h1 id="word" class="word">break a leg</h1>
      <p class="question">의 뜻은 무엇일까요?</p>
      <p class="hint">가장 적절한 한국어 뜻을 선택하세요.</p>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback">
        <div id="feedbackHead" class="feedback-head"></div>
        <div id="meaning" class="meaning"></div>
        <div class="example-label">EXAMPLE</div>
        <div id="example" class="example"></div>
        <div id="translation" class="translation"></div>
        <button id="nextBtn" class="next">다음 문제 →</button>
      </div>
    </section>
  </main>

  <main id="resultScreen" class="screen">
    <section class="card result">
      <div class="badge">✦ QUIZ COMPLETE</div>
      <h2 class="result-title">QUIZ FINISHED!</h2>
      <div class="score"><span id="scoreValue">0</span> / 10</div>
      <div class="result-grid">
        <div class="result-box"><b id="resultAccuracy">0%</b><span>정답률</span></div>
        <div class="result-box"><b id="wrongCount">0</b><span>틀린 단어</span></div>
      </div>
      <div class="review-title">오답 다시 보기</div>
      <div id="review" class="review"></div>
      <button id="restartBtn" class="restart">다시 풀기 ↻</button>
    </section>
  </main>
  <div class="footer">Y2K • FRUTIGER AERO • LEARN BY QUIZZING</div>
</div>

let quiz=[],index=0,score=0,answered=false,wrong=[];
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(){
  quiz=shuffle(vocabulary).slice(0,10); index=0; score=0; answered=false; wrong=[];
  $('quizScreen').classList.add('active');$('resultScreen').classList.remove('active');
  loadQuestion();
}
function loadQuestion(){
  answered=false; const item=quiz[index];
  $('word').textContent=item.word;
  $('progressText').textContent=`${index+1} / 10`;
  $('accuracyText').textContent=index?`${Math.round(score/index*100)}%`:'0%';
  $('progressBar').style.width=`${index/10*100}%`;
  $('feedback').classList.remove('show'); $('feedbackHead').textContent='';
  const distractors=shuffle(vocabulary.filter(v=>v.meaning!==item.meaning)).slice(0,3).map(v=>v.meaning);
  const choices=shuffle([item.meaning,...distractors]);
  $('options').innerHTML='';
  choices.forEach((text,i)=>{
    const btn=document.createElement('button');btn.className='option';btn.dataset.value=text;
    btn.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${text}</span>`;
    btn.addEventListener('click',e=>answer(text,btn,e));$('options').appendChild(btn);
  });
}
function answer(choice,button,e){
  if(answered)return; answered=true;
  const item=quiz[index]; const correct=choice===item.meaning;
  if(correct)score++; else wrong.push(item);
  document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.value===item.meaning)b.classList.add('reveal')});
  button.classList.add(correct?'correct':'wrong');
  if(e){const r=document.createElement('span');r.className='ripple';const rect=button.getBoundingClientRect();const size=Math.max(rect.width,rect.height);r.style.width=r.style.height=size+'px';r.style.left=(e.clientX-rect.left-size/2)+'px';r.style.top=(e.clientY-rect.top-size/2)+'px';button.appendChild(r);setTimeout(()=>r.remove(),550)}
  $('feedbackHead').textContent=correct?'✓ 정답!':'✕ 아쉬워요 — 정답을 확인해 보세요';
  $('feedbackHead').className='feedback-head '+(correct?'ok':'no');
  $('meaning').textContent=item.meaning;
  $('example').textContent=item.example;
  $('translation').textContent='→ '+item.translation;
  $('feedback').classList.add('show');
  $('accuracyText').textContent=`${Math.round(score/(index+1)*100)}%`;
  $('progressBar').style.width=`${(index+1)/10*100}%`;
  $('nextBtn').textContent=index===9?'결과 보기 →':'다음 문제 →';
}
function showResult(){
  $('quizScreen').classList.remove('active');$('resultScreen').classList.add('active');
  $('scoreValue').textContent=score;$('resultAccuracy').textContent=Math.round(score/10*100)+'%';$('wrongCount').textContent=wrong.length;
  $('review').innerHTML=wrong.length?wrong.map(v=>`<div class="review-item"><span>${v.word}</span><small>${v.meaning}</small></div>`).join(''):'<div class="review-item"><span>오답이 없습니다 🎉</span><small>완벽해요!</small></div>';
}
$('nextBtn').addEventListener('click',()=>{if(index===9)showResult();else{index++;loadQuestion()}});
$('restartBtn').addEventListener('click',startQuiz);
startQuiz();
</script>
</body>
</html>
