```html
<!DOCTYPE html>
<html>

<head>
    <title>Welcome</title>

    <style>
        body {
            font-family: Gothic, "Gothic A1", Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        button {
            font-family: Gothic, "Gothic A1", Arial, sans-serif;
            font-size: 20px;
            padding: 12px 20px;
            margin: 5px;
            background-color: pink;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            /* 클릭 애니메이션 */
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        /* 마우스를 올렸을 때 */
        button:hover {
            transform: scale(1.05);
        }

        /* 버튼을 클릭하는 순간 */
        button:active {
            transform: scale(0.92);
            background-color: #ff8fab;
        }
    </style>
</head>

<body>

    <h1>Vocabulary Quiz</h1>

    <p>What does "break a leg" mean?</p>

    <button onclick="checkAnswer('good luck')">
        Good luck
    </button>

    <button onclick="checkAnswer('avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <script>

        function checkAnswer(answer) {

            if (answer === "good luck") {
                document.getElementById("feedback").innerText =
                    "정답! 잘 하셨습니다!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is Good luck.";
            }

        }

    </script>

</body>
</html>
```
